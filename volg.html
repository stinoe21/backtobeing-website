  <!-- Exact dezelfde fontregel als index.html. Inter zonder 300: de site zet
       body-tekst op 400 en met een lichtere snit oogt de pagina meteen als
       een andere website. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Deze pagina hoort bij index.html: dezelfde tokens en dezelfde nav.
       Wijzig je daar iets aan de huisstijl, doe het hier ook. Bewust geen
       footer en geen socialsblok: dit scherm gaat over waar we zijn en wat
       we die dag meemaakten, en alles wat daarvan wegleidt staat al op de
       hoofdsite.

       Opzet: één scherm dat niet als geheel scrollt. Links de kaart, rechts
       één dag tegelijk. Je gaat naar links en rechts door de dagen en scrollt
       alleen binnen de dag die je leest. Op mobiel staat de kaart bovenaan en
       de dag eronder.
       ============================================================ */
    :root {
      --tree:        #2a3723;
      --grass:       #97a081;
      --sky:         #a7bdd5;
      --creek:       #424d69;
      --charcoal:    #161616;
      --canvas:      #fffef1;
      --sand:        #b9a26e;

      --bg:          var(--canvas);
      --ink:         var(--charcoal);
      --ink-soft:    rgba(22, 22, 22, 0.62);
      --line:        rgba(42, 55, 35, 0.18);
      --green:       var(--grass);
      --cream:       var(--canvas);
      --route-main:  var(--grass);
      --route-strong: var(--tree);
      --route-soft:  rgba(151, 160, 129, 0.22);
      --route-wash:  rgba(151, 160, 129, 0.12);
      --nav-h:       72px;

      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --space-7: 4rem;

      --h-card:    clamp(1.85rem, 2.9vw, 2.6rem);

      --display-accent: var(--grass);
      /* Alles rond. Vierkante hoeken alleen waar een vlak tegen de schermrand
         aan loopt en er dus niets te ronden valt. --radius-pill is voor
         knoppen, chips en de voortgangsbalk, --radius-ctrl voor foto's en
         kleine vlakken, --radius / --radius-lg voor panelen. */
      --radius:      28px;
      --radius-lg:   34px;
      --radius-ctrl: 18px;
      --radius-pill: 999px;

      --serif:       "Instrument Serif", Georgia, serif;
      --subhead:     "Inter Tight", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      --sans:        Inter, -apple-system, BlinkMacSystemFont, sans-serif;

      /* Alleen voor deze pagina */
      --pane-x:   clamp(1.5rem, 2.6vw, 2.75rem);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-x: clip;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px; border-radius: 4px;
    }

    .section-label {
      font-family: var(--subhead);
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: inherit; opacity: 0.62;
      margin-bottom: 1.25rem;
    }

    /* ---------- NAV (gelijk aan index.html) ---------- */
    /* Staat altijd in de 'scrolled'-staat, net als de subpagina's op de
       hoofdsite: er ligt hier geen video onder waar hij transparant
       overheen moet vallen. */
    .site-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6vw;
      background: rgba(255,254,241,0.93);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { display: flex; align-items: center; background: none; border: none; cursor: pointer; color: inherit; }
    .nav-logo-mark { width: auto; height: 2rem; flex: 0 0 auto; }
    .nav-menu-btn {
      display: none;
      width: 44px; height: 44px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(22,22,22,0.14);
      border-radius: var(--radius-ctrl);
      background: rgba(255,254,241,0.1);
      color: var(--ink); cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav-menu-icon { width: 18px; height: 12px; position: relative; display: block; transition: opacity 0.2s, transform 0.2s; }
    .nav-menu-icon span {
      position: absolute; left: 0; width: 100%; height: 1.5px;
      background: currentColor; border-radius: 999px;
      transition: transform 0.2s, opacity 0.2s, top 0.2s;
    }
    .nav-menu-icon span:nth-child(1) { top: 0; }
    .nav-menu-icon span:nth-child(2) { top: 5px; }
    .nav-menu-icon span:nth-child(3) { top: 10px; }
    .nav-menu-logo {
      position: absolute; width: 24px; height: auto;
      opacity: 0; transform: rotate(90deg) scale(0.72);
      transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    }
    .site-nav.menu-open .nav-menu-icon { opacity: 0; transform: rotate(-12deg) scale(0.72); }
    .site-nav.menu-open .nav-menu-logo { opacity: 1; transform: rotate(90deg) scale(1); }

    .nav-links { display: flex; align-items: center; gap: 2.5rem; }
    .nav-link {
      font-family: var(--subhead);
      font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-soft); cursor: pointer; transition: color 0.2s;
      background: none; border: none;
    }
    .nav-link:hover, .nav-link.active { color: var(--ink); }
    .nav-cta-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      background: var(--tree); color: var(--canvas) !important;
      border-radius: var(--radius-ctrl); font-size: 0.75rem !important; font-weight: 500;
      letter-spacing: 0.04em !important; text-transform: none !important;
      transition: background 0.2s, color 0.2s, transform 0.2s !important;
    }
    .nav-cta-btn:hover { background: #1F2A19 !important; color: var(--canvas) !important; transform: translateY(-1px); }

    .lang-toggle { display: inline-flex; align-items: center; gap: 0.5rem; padding-left: 0.25rem; }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--subhead);
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-soft); padding: 0.25rem 0.1rem;
      transition: color 0.2s;
    }
    .lang-btn:hover, .lang-btn.active { color: var(--ink); }
    .lang-sep { color: var(--ink-soft); opacity: 0.35; font-size: 0.7rem; user-select: none; }

    /* ============================================================
       SHELL
       ============================================================ */
    .shell { position: relative; }

    /* ---------- KAART ---------- */
    .map-pane {
      position: sticky; top: 0;
      height: 56svh;
      background: var(--canvas);
      overflow: hidden;
      z-index: 0;
    }
    /* Descendant selector tilt de specificity boven MapLibre's
       `.maplibregl-map { position: relative }`, die lazy na onze inline CSS
       wordt geladen en anders wint op bronvolgorde. Met position:relative
       stopt inset:0 met sizen en klapt de container dicht tot 0x0. Zelfde
       valkuil als bij .camino-map in index.html. */
    .map-pane > .map-holder { position: absolute; inset: 0; }

    /* Bewust een overlay-div en GEEN mask-image op de pane: MapLibre hangt
       zijn HTML-markers in de container, dus een mask zou de plaatsnamen aan
       de randen mee wegknippen. Deze wash laat de kaart aan de randen
       oplossen in het canvas in plaats van in een harde rechthoek te staan. */
    .map-wash {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,254,241,0.9) 0%, rgba(255,254,241,0) 20%, rgba(255,254,241,0) 76%, rgba(255,254,241,0.92) 100%),
        linear-gradient(90deg, rgba(255,254,241,0.72) 0%, rgba(255,254,241,0) 14%, rgba(255,254,241,0) 86%, rgba(255,254,241,0.72) 100%);
    }

    .map-loading, .map-error {
      position: absolute; inset: 0; z-index: 6;
      display: grid; place-items: center;
      background: var(--canvas);
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
    }

    /* Klik om te gebruiken. Zonder dit kaapt de kaart op mobiel de scroll. */
    .map-gate {
      position: absolute; inset: 0; z-index: 5;
      border: 0; background: transparent; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .map-gate span {
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      background: rgba(255,254,241,0.94); color: var(--tree);
      padding: 0.55rem 0.9rem; border-radius: var(--radius-ctrl);
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(42,55,35,0.12);
    }
    .map-pane:hover .map-gate, .map-gate:focus-visible { opacity: 1; }
    .map-pane.is-active .map-gate { display: none; }

    /* Lichte variant van de kaart-kaart op Ons verhaal: zelfde opbouw
       (eyebrow, plaats, afstand), maar in canvas zodat hij niet als een
       zwart blok op een lichte kaart ligt. */
    .map-info {
      position: absolute; z-index: 4;
      left: clamp(1rem, 3vw, 2rem); bottom: clamp(1rem, 3vw, 2rem);
      max-width: min(84%, 24rem);
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,254,241,0.9);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 34px rgba(42,55,35,0.08);
      pointer-events: none;
    }
    .map-info .eyebrow {
      display: block; margin-bottom: 0.35rem;
      font-family: var(--subhead); font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft);
    }
    .map-info strong {
      display: block;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(1.15rem, 2.2vw, 1.6rem); line-height: 1.05;
    }
    .map-info .distance {
      display: block; margin-top: 0.35rem;
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
    }
    .map-info .distance[hidden] { display: none; }
    /* De totalen stonden eerst als losse statregel naast de kaart. Daar zeiden
       ze hetzelfde als dit kaartje eronder, dus ze wonen nu hier. */
    .map-cijfers {
      display: flex; gap: 1.5rem;
      margin-top: 0.8rem; padding-top: 0.8rem;
      border-top: 1px solid var(--line);
    }
    .map-cijfers > div { display: flex; flex-direction: column; gap: 0.2rem; }
    .map-cijfers b {
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(1.2rem, 1.9vw, 1.5rem); line-height: 1;
    }
    .map-cijfers i {
      font-style: normal;
      font-family: var(--subhead); font-size: 0.56rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft);
    }
    .map-cijfers[hidden] { display: none; }

    /* Rechtsonder, gespiegeld aan het kaartje links: de weg terug nadat de
       kaart met je is meegezoomd naar één dag. */
    .map-reset {
      position: absolute; z-index: 4;
      right: clamp(1rem, 3vw, 2rem); bottom: clamp(1rem, 3vw, 2rem);
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      background: rgba(255,254,241,0.94); color: var(--tree); cursor: pointer;
      font-family: var(--subhead); font-size: 0.64rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(42,55,35,0.12);
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .map-reset:hover { background: var(--tree); color: var(--canvas); transform: translateY(-2px); }
    .map-reset[hidden] { display: none; }
    /* Op mobiel staat de knop naast het kaartje linksonder; daar past alleen
       de korte tekst. */
    .map-reset .reset-kort { display: none; }

    .map-legend {
      position: absolute; z-index: 4;
      right: clamp(1rem, 3vw, 2rem); bottom: calc(clamp(1rem, 3vw, 2rem) + 3.2rem);
      display: flex; flex-direction: column; gap: 0.4rem;
      font-family: var(--subhead); font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
      pointer-events: none; text-align: right;
    }
    .map-legend > span { display: inline-flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
    .map-legend i { width: 20px; height: 0; display: block; flex: 0 0 20px; }
    .lg-done { border-top: 3px solid var(--tree); border-radius: 2px; }
    .lg-plan { border-top: 2px dashed var(--grass); }

    .map-attr {
      position: absolute; z-index: 4;
      right: clamp(1rem, 3vw, 2rem); top: calc(var(--nav-h) + 0.6rem);
      font-size: 0.58rem; letter-spacing: 0.02em;
      color: var(--ink); opacity: 0.3;
    }
    .map-attr a:hover { text-decoration: underline; }

    /* Eigen plaatsnamen in de huisstijl. De nolabels-basemap heeft geen
       symbol-layers, dus er is geen font-probleem: MapLibre kan alleen
       fonts renderen die in de glyph-server van de tile-aanbieder zitten,
       en Inter Tight zit daar niet in. */
    .map-place {
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.04em; color: var(--tree); white-space: nowrap;
      text-shadow:
        0 0 3px var(--canvas), 0 0 3px var(--canvas),
        0 0 6px var(--canvas), 0 0 6px var(--canvas);
      pointer-events: none;
    }
    .map-place.is-endpoint {
      text-transform: uppercase; letter-spacing: 0.1em;
      font-weight: 600; font-size: 0.7rem;
    }
    .map-punt {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--route-main);
      border: 2px solid var(--cream);
      box-shadow: 0 0 0 3px var(--route-soft);
    }
    .map-dag {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--route-strong); color: var(--cream);
      border: 2px solid var(--cream);
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 600;
      display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 0 0 5px rgba(151,160,129,0.28);
    }
    /* Laatst bekende punt. Bewust het eindpunt van de laatste etappe en niet
       een live locatie: we delen waar we die dag geëindigd zijn, niet waar we
       op dit moment lopen. */
    .map-positie { position: relative; width: 20px; height: 20px; }
    .map-positie::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: var(--route-main);
      animation: puls 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
    }
    .map-positie::after {
      content: ''; position: absolute; inset: 4px; border-radius: 50%;
      background: var(--route-strong); border: 2px solid var(--cream);
    }
    @keyframes puls {
      0%   { transform: scale(0.5); opacity: 0.7; }
      70%  { transform: scale(2.8); opacity: 0; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .map-positie::before { animation: none; opacity: 0.35; } }

    /* ---------- FEED ---------- */
    /* Kop bovenaan die blijft staan, daaronder één dag tegelijk. Je gaat naar
       links en rechts door de dagen, niet omlaag door een lange lijst. */
    .feed-pane {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; min-height: 0;
      background: var(--canvas);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      margin-top: -34px;
      box-shadow: 0 -18px 40px rgba(42,55,35,0.07);
    }
    .feed-grip {
      flex: 0 0 auto;
      width: 42px; height: 4px; border-radius: var(--radius-pill);
      background: rgba(42,55,35,0.28);
      margin: 0.7rem auto 0;
    }
    .feed-kop {
      flex: 0 0 auto;
      padding: var(--space-4) var(--pane-x) var(--space-3);
    }
    /* Op een breed scherm is de helft van het venster te breed voor tekst.
       Deze grens houdt de regellengte leesbaar zonder de kolom te versmallen. */
    .kop-inner, .slide-inner { max-width: 780px; }

    /* ---------- HERO ---------- */
    .hero-label { display: inline-flex; align-items: center; gap: 0.55rem; }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--grass);
      animation: livepuls 2.2s ease-out infinite;
    }
    @keyframes livepuls {
      0%   { box-shadow: 0 0 0 0 rgba(151,160,129,0.7); }
      70%  { box-shadow: 0 0 0 9px rgba(151,160,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(151,160,129,0); }
    }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

    .kop-rij {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: var(--space-3); flex-wrap: wrap;
    }
    .feed-kop h1 {
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(2.5rem, 4.6vw, 3.6rem);
      line-height: 0.94; letter-spacing: 0;
      margin: 0.35rem 0 0;
    }
    .feed-kop h1 em { font-style: italic; color: var(--display-accent); }

    /* Bladeren door de dagen: twee ronde chevron-knoppen met daartussen een
       pil met één stip per etappe. Eén gecentreerd groepje onder de kaarten,
       zodat de kop alleen nog de titel draagt. De stippen volgen de dag die
       je LEEST: tot en met die dag donker, gelopen dagen erna als lichte
       tussentint, de rest bijna onzichtbaar. Zo zegt de rij hetzelfde als
       "Dag 2 van 6" erboven. */
    .voortgang {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      gap: 0.8rem;
      padding: 0.45rem clamp(18px, 7%, 72px) var(--space-4);
    }
    .voortgang[hidden] { display: none; }
    .dag-nav {
      width: 44px; height: 44px; flex: 0 0 44px;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: rgba(42, 55, 35, 0.08); color: var(--tree);
      box-shadow: inset 0 0 0 1px rgba(42, 55, 35, 0.16);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }
    .dag-nav svg { display: block; }
    .dag-nav:hover:not(:disabled) { background: var(--tree); color: var(--canvas); }
    .dag-nav:disabled { opacity: 0.28; cursor: default; }
    .dag-nav[hidden] { display: none; }
    .voortgang-bar {
      display: flex; align-items: center; gap: 0.1rem;
      height: 44px; padding: 0 0.35rem;
      background: rgba(42, 55, 35, 0.08);
      border-radius: var(--radius-pill);
    }
    /* De dagen staan als cijfer in de balk en niet als bolletje: dan zie je
       meteen waar je bent, hoeveel dagen er zijn en waar je heen klikt. Een
       dag die er nog niet is blijft staan, maar grijs en niet aanklikbaar. */
    .voortgang-bar button {
      min-width: 28px; height: 32px; padding: 0 0.3rem;
      border: 0; border-radius: var(--radius-pill);
      background: none; color: var(--tree); cursor: pointer;
      font-family: var(--subhead); font-size: 0.76rem; font-weight: 600;
      font-variant-numeric: tabular-nums; line-height: 1;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .voortgang-bar button:disabled { color: rgba(42, 55, 35, 0.32); cursor: default; }
    .voortgang-bar button:not(:disabled):hover { background: rgba(42, 55, 35, 0.14); }
    /* De dag die vandaag gelopen wordt maar nog niet gepost is: een randje,

    /* Statusregel voor de dag die nu bezig is. Bewust één regel en geen

    .vandaag {

      padding: 1rem 1.35rem;

      overflow-y: auto; overscroll-behavior: contain;

    /* ---------- CARROUSEL ---------- */
    /* Scroll-snap in plaats van transform: dan is swipen op mobiel gewoon de

       Horizontaal tussen de dagen, verticaal binnen één dag.

       volgende dag kijkt aan de rand alvast mee, en dat is de hele uitleg die
       de carrousel nodig heeft. De kaartbreedte volgt uit de padding van de
       track: elke kaart is 100% van de content-box, dus wat hier aan de
       zijkanten afgaat is precies wat er van de buren te zien is. */
    .dag-carousel { position: relative; flex: 1 1 auto; min-height: 0; }
    .dag-carousel[hidden] { display: none; }
    .dag-track {
      display: flex; height: 100%;

       Klikken op een buurkaart maakt hem de actieve dag. */

    /* De mooiste foto opent de dag. In de kaart is hij het venster op de dag
       en vult hij alle ruimte die de regels eronder overlaten; in het
       leesvenster staat hij als vaste banner boven het verhaal. */
    .dag-hero {
      display: block; width: 100%; padding: 0; border: 0;
      background: none; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .dag-hero img {
      display: block; width: 100%; object-fit: cover;
      /* Iets boven het midden: in een staande telefoonfoto zit het gezicht

      object-position: 50% 30%;

      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* In de kaart wisselen de foto's van de dag vanzelf, als een rustige
       crossfade: alle beelden liggen gestapeld en alleen .is-zicht is te

    .hero-stippen {

      display: flex; gap: 6px; pointer-events: none;

    .hero-stip {

      transition: background 0.3s ease, transform 0.3s ease;
    }
    .hero-stip.is-zicht { background: var(--canvas); transform: scale(1.15); }
    .dag-popup .dag-hero { cursor: zoom-in; }
    .dag-popup .dag-hero img { aspect-ratio: 21/10; }
    .dag-popup .dag-hero:hover img { transform: scale(1.03); }
    @media (prefers-reduced-motion: reduce) {

    }
    .dag-body { padding: clamp(1.3rem, 2vw, 1.9rem) clamp(1.3rem, 2.4vw, 2.2rem) clamp(1.6rem, 2.4vw, 2.4rem); }
    .dag-slide .dag-body { flex: 0 0 auto; }

    /* Geen knop-doos maar een stille wenk: de hele kaart is al klikbaar. */
    /* De hele kaart opent het verhaal, maar dat zie je niet. Daarom staat de
       actie er als een echte knop: gevuld in het donkergroen, dezelfde pil
       als elders op de site. */
    .dag-lees {
      margin-top: var(--space-3);
      display: inline-flex; align-items: center; gap: 0.55rem;
      padding: 0.72rem 1.25rem;
      border: 1px solid var(--tree); border-radius: var(--radius-pill);
      background: var(--tree); color: var(--canvas); cursor: pointer;
      font-family: var(--subhead); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;

    @media (prefers-reduced-motion: reduce) {

    .dag-datum {
      font-family: var(--subhead); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft);
    }
    /* De dagtitel staat in Inter Tight en niet in de serif: hij zegt vaak
       'Dag 1 (Valença - O Porrino)', en cijfers en haakjes lezen strakker in
       de schreefloze. Zwaarder en iets ingesnoerd, want op deze grootte staat
       Inter Tight anders los. */
    .dag-titel {
      font-family: var(--subhead); font-weight: 600;
      font-size: clamp(1.45rem, 2.4vw, 1.85rem); line-height: 1.16;
      letter-spacing: -0.015em;
      margin: 0.55rem 0 0.35rem;
    }
    .dag-route {
      font-family: var(--subhead); font-size: 0.92rem; font-weight: 500;
      color: var(--ink-soft); margin-bottom: var(--space-4);
    }
    .dag-route .pijl { color: var(--grass); padding: 0 0.15em; }
    /* Zelfde vorm als de cijfers in het kaartje op de kaart: serif-getal met
       een klein kapitaaltje eronder. Eén cijfertaal voor de hele pagina. */
    .dag-cijfers {
      display: flex; flex-wrap: wrap; gap: 1.1rem 2.2rem;
      margin-bottom: var(--space-4);
    }
    .dag-cijfers > div { display: flex; flex-direction: column; gap: 0.25rem; }
    .dag-cijfers b {
      font-family: var(--serif); font-weight: 400;
      font-size: 1.5rem; line-height: 1;
    }
    .dag-cijfers i {
      font-style: normal;
      font-family: var(--subhead); font-size: 0.58rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft);
    }
    .dag-tekst { font-size: 0.98rem; line-height: 1.75; color: var(--ink-soft); }
    .dag-tekst + .dag-tekst { margin-top: 0.85rem; }
    /* Vet in een dagtekst is een accent, geen kop: zelfde grootte, alleen
       zwaarder en in de donkere inkt. */
    .dag-tekst strong { font-weight: 600; color: var(--ink); }
    .dag-nietvertaald {
      margin-top: 0.7rem;
      font-family: var(--subhead); font-size: 0.64rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-soft); opacity: 0.7;
    }
    /* De foto's zijn waar het om gaat, dus ze mogen groot. Elke foto is een
       knop: klikken opent hem schermvullend. */
    .dag-fotos {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px; margin-top: var(--space-4);
    }
    .dag-foto {
      display: block; padding: 0; border: 0; background: none;
      border-radius: var(--radius-ctrl); overflow: hidden;
      cursor: zoom-in; -webkit-tap-highlight-color: transparent;
    }
    .dag-foto img {
      width: 100%; aspect-ratio: 4/5; object-fit: cover;
      background: var(--route-wash);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dag-foto:hover img { transform: scale(1.045); }
    .dag-foto.wide { grid-column: 1 / -1; }
    .dag-foto.wide img { aspect-ratio: 3/2; }
    @media (prefers-reduced-motion: reduce) { .dag-foto:hover img { transform: none; } }

    /* ---------- HET VERHAAL (leesvenster) ---------- */
    /* De kaarten bladeren, dit venster leest. Onder de lightbox (300) zodat
       een foto uit het verhaal er nog bovenop kan. */
    .dag-popup {
      position: fixed; inset: 0; z-index: 250;
      display: grid; place-items: center;
      padding: clamp(0.75rem, 3vw, 3rem);
      background: rgba(18, 20, 16, 0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dag-popup[hidden] { display: none; }
    .popup-paneel {
      width: min(100%, 660px);
      max-height: 100%;
      overflow-y: auto; overscroll-behavior: contain;
      background: var(--canvas);
      border-radius: var(--radius-lg);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35);
      scrollbar-width: thin;
      scrollbar-color: rgba(42, 55, 35, 0.3) transparent;
      animation: paneelIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes paneelIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
    }
    @media (prefers-reduced-motion: reduce) { .popup-paneel { animation: none; } }
    .popup-sluit { top: clamp(0.75rem, 3vw, 2rem); right: clamp(0.75rem, 3vw, 2rem); }

    /* ---------- FOTO SCHERMVULLEND ---------- */
    .lightbox {
      /* Boven de nav (200): een foto schermvullend is schermvullend, en het
         kruisje rechtsboven viel anders precies achter de navbalk. */
      position: fixed; inset: 0; z-index: 300;
      display: grid; place-items: center;
      padding: clamp(1rem, 5vw, 3.5rem);
      background: rgba(18, 20, 16, 0.88);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      max-width: 100%; max-height: 84vh; width: auto;
      border-radius: var(--radius); box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    .lb-knop {
      position: absolute; width: 46px; height: 46px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,254,241,0.32); border-radius: var(--radius-pill);
      background: rgba(255,254,241,0.12); color: var(--canvas);
      font-size: 1.1rem; line-height: 1; cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .lb-knop:hover { background: rgba(255,254,241,0.26); }
    .lb-sluit { top: clamp(0.75rem, 3vw, 2rem); right: clamp(0.75rem, 3vw, 2rem); }
    .lb-prev { left: clamp(0.5rem, 2vw, 2rem); top: 50%; transform: translateY(-50%); }
    .lb-next { right: clamp(0.5rem, 2vw, 2rem); top: 50%; transform: translateY(-50%); }
    .lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.06); }
    .lb-teller {
      position: absolute; bottom: clamp(0.75rem, 3vw, 2rem); left: 50%;
      transform: translateX(-50%);
      font-family: var(--subhead); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.16em; color: rgba(255,254,241,0.7);
    }

    /* ---------- TEASER (voor vertrek) ---------- */
    /* De reis die eraan komt, beeld eerst: de vertrekregel en de route staan
       op de foto. Geen kaartrand of schaduw: de foto staat in de pagina zoals
       elk beeld op de hoofdsite (afgerond, verder niets). */
    .teaser-kaart { margin-top: var(--space-4); }
    .teaser-held {
      position: relative; height: clamp(320px, 52vh, 560px);
      border-radius: var(--radius); overflow: hidden;
    }
    .teaser-held img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: 50% 30%; display: block;
    }
    /* Onderin net donker genoeg voor de tekst; bovenin blijft de foto vrij. */
    .teaser-held::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(18, 20, 16, 0) 42%, rgba(18, 20, 16, 0.14) 62%, rgba(18, 20, 16, 0.56) 100%);
    }
    .teaser-held.is-zonder-foto { background: var(--tree); }
    .teaser-tekst {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
      padding: clamp(1.1rem, 3vw, 1.8rem);
      color: var(--canvas);
    }
    .teaser-eyebrow {
      margin: 0 0 0.55rem;
      font-family: var(--subhead); font-size: 0.64rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.7;
      color: rgba(255, 254, 241, 0.82);
    }
    /* Smal scherm: breken mag alleen tussen plaats en datum, en datum en
       tijd blijven altijd bij elkaar. */
    .teaser-eyebrow span { white-space: nowrap; }
    .teaser-titel {
      margin: 0;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(1.6rem, 3.2vw, 2.3rem); line-height: 1.04;
    }
    .teaser-titel .pijl { color: rgba(255, 254, 241, 0.6); }
    .teaser-feiten {
      margin: 0.55rem 0 0;
      font-family: var(--subhead); font-size: 0.82rem; font-weight: 500;
      letter-spacing: 0.02em; color: rgba(255, 254, 241, 0.85);
    }
    /* Onder de kaart een klein socialsblok: zolang we niet vertrokken zijn
       valt er op de kaart nog niets te volgen, en zijn dit de plekken waar
       al wel iets staat. Verdwijnt samen met de teaser zodra dag 1 er is.
       Geen footer op deze pagina: dit scherm gaat over waar we zijn en wat
       we die dag meemaakten. Alles wat daarvan wegleidt staat op de
       hoofdsite, die via de nav bereikbaar blijft. */
    .teaser-socials {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.75rem; padding: 1rem 0.5rem 0.2rem;
    }
    .teaser-socials-kop {
      margin: 0;
      font-family: var(--subhead); font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft);
    }
    .teaser-socials-rij {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
    }
    .teaser-socials-rij a {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      font-family: var(--subhead); font-size: 0.78rem; font-weight: 500;
      color: var(--ink); text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .teaser-socials-rij a:hover,
    .teaser-socials-rij a:focus-visible {
      background: var(--route-wash); border-color: var(--grass); color: var(--tree);
    }
    .teaser-socials-rij svg { width: 15px; height: 15px; display: block; flex: none; }
    @media (prefers-reduced-motion: reduce) {
      .teaser-socials-rij a { transition: none; }
    }

    /* ============================================================
       DESKTOP: half kaart, half verhaal. Allebei schermhoog, en de enige
       scroll zit binnen de dag die je op dat moment leest.
       ============================================================ */
    @media (min-width: 1024px) {
      html, body { height: 100%; overflow: hidden; }
      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        height: 100dvh;
      }
      .map-pane {
        position: relative; top: auto;
        height: 100dvh;
      }
      .map-wash {
        background:
          linear-gradient(180deg, rgba(255,254,241,0.92) 0%, rgba(255,254,241,0) 15%, rgba(255,254,241,0) 84%, rgba(255,254,241,0.85) 100%),
          linear-gradient(90deg, rgba(255,254,241,0.88) 0%, rgba(255,254,241,0) 13%, rgba(255,254,241,0) 82%, rgba(255,254,241,0.95) 100%);
      }
      .feed-pane {

        border-radius: 0; margin-top: 0; box-shadow: none;
      }
      .feed-grip { display: none; }
      .feed-kop { padding-top: calc(var(--nav-h) + var(--space-4)); }
    }

    /* Kort en breed (laptop in landschap): iets compacter. */
    @media (min-width: 1024px) and (max-height: 760px) {
      .feed-kop h1 { font-size: clamp(2.1rem, 3.2vw, 2.8rem); }
      .feed-kop { padding-bottom: var(--space-2); }
      .dag-fotos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* ============================================================
       MOBIEL: kaart bovenaan, dag eronder. Ook hier één scherm, zodat
       links en rechts vegen door de dagen werkt zonder dat de pagina
       eronder mee schuift.
       ============================================================ */
    @media (max-width: 1023px) {
      html, body { height: 100%; overflow: hidden; }
      .shell { display: flex; flex-direction: column; height: 100dvh; }
      .map-pane {
        position: relative; top: auto;
        flex: 0 0 auto; height: 48svh;
        padding-top: var(--nav-h);
      }
      .feed-pane { flex: 1 1 auto; min-height: 0; }
      /* De kop is hier zo compact mogelijk: elke pixel die hij niet neemt is
         een pixel die de dagkaart eronder wel krijgt, en die moet minstens de
         foto plus de titel laten zien. */
      .feed-grip { margin-top: 0.45rem; }
      .feed-kop { padding: var(--space-2) var(--pane-x) var(--space-2); }
      .feed-kop h1 { font-size: clamp(1.8rem, 7vw, 2.2rem); margin-top: 0.15rem; }
      .voortgang {
        padding: 0.35rem clamp(14px, 5.5%, 28px)
                 calc(0.85rem + env(safe-area-inset-bottom, 0px));
        gap: 0.5rem;
      }
      /* Zeven cijfers plus twee pijlen is krap op een smalle telefoon: daar
         schuiven de knoppen dichter op elkaar en worden ze een maat kleiner.
         Nog steeds ruim boven de 24 px die een vinger nodig heeft, want de
         hele knop is raakvlak en niet alleen het cijfer. */
      .voortgang-bar { gap: 0; padding: 0 0.25rem; }
      .voortgang-bar button { min-width: 26px; padding: 0 0.2rem; font-size: 0.72rem; }

      /* Alleen begin- en eindpunt: de rest wordt leesbaar zodra je op een dag
         inzoomt, en zou hier alleen maar over elkaar heen vallen. */
      .map-place.is-tussen { display: none; }

      /* Het kaartje moet ruim boven de rand van het dagpaneel blijven: dat
         schuift 34 px over de kaart heen en zou het anders afknippen. Niet de
         volle breedte: dan bedekt het de halve kaart, en de kaart is hier al
         klein genoeg. */
      .map-info {
        left: 0.9rem; right: auto; bottom: 2.9rem;
        max-width: min(62vw, 244px); padding: 0.7rem 1rem;
      }
      .map-info .eyebrow { margin-bottom: 0.2rem; font-size: 0.58rem; }
      .map-info strong { font-size: 1.3rem; }
      .map-cijfers { gap: 1.75rem; margin-top: 0.5rem; padding-top: 0.5rem; }
      .map-cijfers b { font-size: 1.1rem; }
      /* Op één lijn met het kaartje links, in de vrije rechteronderhoek. */
      .map-reset { right: 0.9rem; bottom: 2.9rem; padding: 0.55rem 0.95rem; }
      .map-reset .reset-lang { display: none; }
      .map-reset .reset-kort { display: inline; }

      /* De kaarten zijn hier laag: de cijfers verhuizen naar het leesvenster
         zodat de foto de ruimte houdt. */
      .dag-track { gap: 12px; padding: 4px clamp(14px, 5.5%, 28px) 22px; }
      .dag-slide .dag-cijfers { display: none; }
      .dag-popup .dag-hero img { aspect-ratio: 16/9; }
      .dag-body { padding: 1.15rem 1.15rem 1.5rem; }
      /* Beeld eerst, ook hier: staand kader, dichter bij een telefoonfoto. */
      .teaser-held { height: auto; aspect-ratio: 4/5; max-height: 62svh; }
    }
    @media (max-width: 760px) {
      .site-nav {
        flex-wrap: nowrap; align-content: center; gap: 1rem;
        padding: 0 max(1rem, 5vw);
      }
      .nav-logo { width: auto; justify-content: flex-start; }
      .nav-logo-mark { height: 1.5rem; max-width: min(64vw, 230px); }
      .nav-menu-btn { display: inline-flex; margin-left: auto; }

  <div class="shell">

    <!-- ============ KAART ============ -->

        <div class="map-cijfers" id="mapCijfers" hidden>

      <!-- De kaart volgt de dag die je leest; deze knop zoomt weer uit naar

      <!-- Onderaan, als paginering onder de kaarten: metadata, geen kop. -->

        <button class="dag-nav" id="dagVorige" type="button" data-i18n-aria="nav.vorige" aria-label="Vorige dag"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 4 6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

      </div>

  <!-- Het verhaal van een dag, in een eigen venster -->
  <div class="dag-popup" id="dagPopup" hidden>
    <div class="popup-paneel" id="popupPaneel" role="dialog" aria-modal="true"></div>
    <button class="lb-knop popup-sluit" id="popupSluit" type="button" data-i18n-aria="foto.sluit" aria-label="Sluiten">&times;</button>

  <!-- Foto schermvullend -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lbImg" alt="" />

    <span class="lb-teller" id="lbTeller"></span>
  </div>

  <script>
  (function () {
    'use strict';

    /* ---------- i18n ---------- */
    const I18N = {
      nl: {
        'nav.story': 'Ons verhaal',
        'nav.press': 'In de pers',
        'nav.volg': 'Volg ons',
        'nav.contact': 'Contact',

        'map.eyebrowPre': 'De route',
        'map.eyebrowLive': 'Waar we nu zijn',
