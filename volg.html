        'titel.dag0Kort': 'De reisdag',
        'titel.binnenkort': 'Volg hier onze <em>reis</em>',
        'titel.morgen': 'Morgen <em>beginnen</em> we',
        'titel.vandaag': 'Vandaag <em>beginnen</em> we',
        'dag.nietVertaald': '',
        'vandaag.nu': 'Vandaag lopen we',
        'vandaag.straks': 'Vanavond verschijnt hier de route.',
        'van.km': 'van',
        'map.reset': 'Bekijk de hele route',
        'map.resetKort': 'Hele route',
        'teaser.vertrek': 'Vertrek uit {plaats}',
        'teaser.feiten': '{km} km · {n} dagen · te voet',
        'socials.kop': 'Volg ons ook op',
      },
      en: {
        'nav.story': 'Our story',
        'nav.press': 'Press',
        'nav.volg': 'Follow us',
        'nav.contact': 'Contact',
        'hero.labelLive': 'Live from the Camino',
        'hero.labelPre': 'Not on the road yet',
        'hero.labelKlaar': 'We made it',
        'stat.dagen': 'Stages done',
        'nav.vorige': 'Previous day',
        'nav.volgende': 'Next day',
        'nav.etappe': 'Stage',
        'foto.sluit': 'Close',
        'foto.vorige': 'Previous photo',
        'foto.volgende': 'Next photo',
        'foto.open': 'View photo {n} full size',
        'map.loading': 'Loading map',
        'map.error': 'Map could not load',
        'map.activate': 'Use the map',
        'map.eyebrowPre': 'The route',
        'map.eyebrowLive': 'Where we are now',
        'legend.gelopen': 'Walked',
        'legend.plan': 'To go',
        'dag.afstand': 'Distance',
        'dag.tijd': 'Moving time',
        'dag.hoogte': 'Elevation',
        'dag.lees': 'Read the story',
        'titel.dag': 'Day',
        'titel.van': 'of',
        'titel.dag0': 'The <em>travel day</em>',
        'titel.dag0Kort': 'The travel day',
        'titel.binnenkort': 'Follow our <em>journey</em> here',
        'titel.morgen': 'We start <em>tomorrow</em>',
        'titel.vandaag': 'We start <em>today</em>',
        'dag.nietVertaald': 'This update has not been translated yet.',
        'vandaag.nu': 'Today we walk',
        'vandaag.straks': 'The route appears here tonight.',
        'van.km': 'of',
        'map.reset': 'See the whole route',
        'map.resetKort': 'Whole route',
        'teaser.vertrek': 'Departure from {plaats}',
        'teaser.feiten': '{km} km · {n} days · on foot',
        'socials.kop': 'Follow us on',
      },
    };

    let lang = localStorage.getItem('b2b-lang') === 'en' ? 'en' : 'nl';
    /* Op undefined testen en niet op falsy: een vertaling die bewust leeg is
       ('') zou met || terugvallen op het Nederlands en zo een half Nederlandse
       zin opleveren. */
    function t(key) {
      const woordenboek = I18N[lang];
      if (woordenboek && woordenboek[key] !== undefined) return woordenboek[key];
      if (I18N.nl[key] !== undefined) return I18N.nl[key];
      return key;
    }
    function loc() { return lang === 'en' ? 'en-GB' : 'nl-NL'; }

    /* ---------- state ---------- */
    let route = null;   // data/camino-route.json
    let log = null;     // data/camino-log.json
    let map = null;
    const breed = window.matchMedia('(min-width: 1024px)');

    /* ---------- helpers ---------- */
    function fmtKm(km) {
      return (Math.round(km * 10) / 10).toLocaleString(loc(), {
        minimumFractionDigits: 1, maximumFractionDigits: 1,
      });
    }
    function fmtTijd(sec) {
      const u = Math.floor(sec / 3600);
      const m = Math.round((sec % 3600) / 60);
      return lang === 'en' ? u + 'h ' + m + 'm' : u + 'u ' + m + 'm';
    }
    function fmtDatum(iso) {
      const d = new Date(iso + 'T12:00:00');
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long' });
    }
    /* Hele dagen tussen vandaag en een datum. Middag als ankerpunt, zodat
       zomertijd de uitkomst niet met een dag verschuift. */
    function dagenTot(iso) {
      const doel = new Date(iso + 'T12:00:00');
      if (isNaN(doel)) return null;
      const nu = new Date();
      const vandaag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate(), 12, 0, 0);
      return Math.round((doel - vandaag) / 86400000);
    }
    function vandaagISO() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function etappeCoords(etappe) {
      if (!route || !etappe) return [];
      return route.punten.slice(etappe.vanIndex, etappe.totIndex).map(p => p.lngLat);
    }
    function etappeVoorDag(nr) {
      if (!route) return null;
      return route.etappes.find(e => e.dag === nr) || null;
    }
    function dagenOplopend() {
      return (log && Array.isArray(log.dagen) ? log.dagen.slice() : [])
        .sort((a, b) => a.dag - b.dag);
    }
    /* Dag 0 is de reisdag naartoe: een post als elke andere, maar er is niets
       gelopen. Overal waar we etappes tellen (voortgang, kaart, titel) telt
       hij dus niet mee. */
    function etappeDagen() {
      return dagenOplopend().filter(d => d.dag >= 1);
    }
    /* Alle daadwerkelijk gelopen coordinaten aaneengeregen. Dagen zonder
       GPX vallen terug op de geplande etappe, zodat de lijn niet onderbroken
       raakt als er een dag mist. */
    function gelopenCoords() {
      const out = [];
      for (const d of dagenOplopend()) {
        const c = (d.track && Array.isArray(d.track.coords) && d.track.coords.length)
          ? d.track.coords
          : etappeCoords(etappeVoorDag(d.dag));
        for (const p of c) out.push(p);
      }
      return out;
    }
    function totalen() {
      let km = 0, hoogte = 0;
      for (const d of dagenOplopend()) {
        if (d.track) {
          km += d.track.afstandKm || 0;
          hoogte += d.track.hoogtemeters || 0;
        } else {
          const e = etappeVoorDag(d.dag);
          if (e) km += e.km;
        }
      }
      return { km: km, hoogte: hoogte };
    }
    function huidigeEtappe() {
      if (!route) return null;
      const vandaag = vandaagISO();
      return route.etappes.find(e => e.datum === vandaag) || null;
    }

    /* ---------- statische teksten ---------- */
    function applyStaticText() {
      document.documentElement.lang = lang;
      const ogLocale = document.getElementById('ogLocale');
      if (ogLocale) ogLocale.setAttribute('content', lang === 'en' ? 'en_GB' : 'nl_NL');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key] !== undefined) {
          // Het woordenboek staat inline in dit bestand en komt nooit van
          // buiten, dus innerHTML is hier veilig. Dagteksten uit de JSON
          // gaan bewust via textContent.
          el.innerHTML = I18N[lang][key];
        }
      });
      // Knoppen zonder tekst (pijlen, kruisje) hebben alleen een aria-label.
      // Die moet net zo goed meevertalen als de zichtbare tekst.
      document.querySelectorAll('[data-i18n-aria]').forEach(el => {
        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });

      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
    }

    /* ---------- kop ---------- */
    function totaalDagen() {
      return route && route.etappes.length ? route.etappes.length : 6;
    }

    function renderKop() {
      const dagen = dagenOplopend();
      const gelopen = etappeDagen();
      const label = document.getElementById('heroLabel');

      if (gelopen.length >= totaalDagen()) label.textContent = t('hero.labelKlaar');
      else if (dagen.length) label.textContent = t('hero.labelLive');
      else label.textContent = t('hero.labelPre');

      // Voortgangsbalk: één knop per etappe. Een dag die er is, is klikbaar.
      // Voor vertrek is er niets om door te bladeren, dus ook geen balk.
      const bar = document.getElementById('voortgangBar');
      bar.closest('.voortgang').hidden = !gelopen.length;
      bar.textContent = '';
      const nu = huidigeEtappe();

      // De reisdag heeft geen etappenummer, maar hoort wel in de balk: anders
      // is hij alleen met de pijl terug te vinden.
      const reisdag = dagen.findIndex(d => d.dag === 0);
      if (reisdag !== -1) {
        const seg = document.createElement('button');
        seg.type = 'button';
        seg.dataset.index = String(reisdag);
        seg.textContent = '0';
        seg.setAttribute('aria-label', t('titel.dag0Kort'));
        seg.addEventListener('click', () => toonDag(reisdag));
        bar.appendChild(seg);
      }

      for (let i = 1; i <= totaalDagen(); i++) {
        const index = dagen.findIndex(d => d.dag === i);
        const seg = document.createElement('button');
        seg.type = 'button';
        seg.dataset.index = String(index);
        seg.textContent = String(i);
        const etappe = etappeVoorDag(i);
        seg.setAttribute('aria-label',
          t('nav.etappe') + ' ' + i + (etappe ? ': ' + etappe.van + ' → ' + etappe.naar : ''));
        if (index !== -1) {
          seg.addEventListener('click', () => toonDag(index));
        } else {
          seg.disabled = true;
          if (nu && nu.dag === i) seg.className = 'is-now';
        }
        bar.appendChild(seg);
      }

      // Op de reisdag is er nog geen kilometer gelopen, dus dan blijft de
      // kaart de hele route tonen in plaats van 'waar we nu zijn'.
      renderMapInfo(gelopen.length ? gelopen[gelopen.length - 1] : null);
    }

    /* De titel volgt de dag die je op dat moment leest, niet de laatste dag. */
    function zetTitel() {
      const titel = document.getElementById('heroTitle');
      const dagen = dagenOplopend();

      if (!dagen.length) {
        // Aftellen. Bewust geen lege dagkaartjes, alleen hoeveel nachtjes nog.
        const start = (log && log.startDatum) || (route && route.etappes[0] && route.etappes[0].datum);
        const n = start ? dagenTot(start) : null;
        if (n === null) titel.innerHTML = t('hero.labelPre');
        else if (n <= 0) titel.innerHTML = t('titel.vandaag');
        else if (n === 1) titel.innerHTML = t('titel.morgen');
        // Verder weg dan morgen blijft het bij 'binnenkort': een exact aantal
        // dagen boven de kaart voegt niets toe aan wat er al staat.
        else titel.innerHTML = t('titel.binnenkort');
        return;
      }

      const d = dagen[Math.min(actieveDag, dagen.length - 1)];
      if (d.dag === 0) { titel.innerHTML = t('titel.dag0'); return; }
      titel.innerHTML = t('titel.dag') + ' <em>' + d.dag + '</em> ' + t('titel.van') + ' ' + totaalDagen();
    }

    /* Het blokje op de kaart: vóór vertrek de hele route, onderweg de plek
       waar we het laatst waren. */
    function renderMapInfo(laatste) {
      if (!route || !route.punten.length) return;
      const eyebrow = document.getElementById('mapEyebrow');
      const plaats = document.getElementById('mapPlaats');
      const afstand = document.getElementById('mapAfstand');
      const totaal = route.totaalKm || 123;

      const cijfers = document.getElementById('mapCijfers');
      const dagen = etappeDagen();

      if (laatste) {
        const e = etappeVoorDag(laatste.dag);
        eyebrow.textContent = t('map.eyebrowLive');
        plaats.textContent = laatste.naar || (e && e.naar) || '';
        // De totalen stonden hiervoor als losse statregel rechts. Die staan nu
        // hier, en dan zou de regel eronder hetzelfde nog eens zeggen: de
        // afstand staat al als eerste cijfer. Dus die regel gaat weg.
        afstand.hidden = true;
        cijfers.hidden = false;
        document.getElementById('mapKm').textContent = fmtKm(totalen().km);
        document.getElementById('mapKmLabel').textContent = t('van.km') + ' ' + totaal + ' km';
        document.getElementById('mapEtappes').textContent = dagen.length + ' / ' + totaalDagen();
        document.getElementById('mapReset').hidden = false;
      } else {
        eyebrow.textContent = t('map.eyebrowPre');
        plaats.textContent = route.punten[0].naam + ' → ' + route.punten[route.punten.length - 1].naam;
        afstand.hidden = false;
        afstand.textContent = totaal + ' km';
        cijfers.hidden = true;
        document.getElementById('mapReset').hidden = true;
      }
    }

    /* ---------- vandaag-strip ---------- */
    function renderVandaag() {
      const slot = document.getElementById('vandaagSlot');
      slot.textContent = '';
      const e = huidigeEtappe();
      if (!e) return;
      if (dagenOplopend().some(d => d.dag === e.dag)) return; // al gelogd

      const div = document.createElement('div');
      div.className = 'vandaag';
      const b = document.createElement('b');
      b.textContent = t('vandaag.nu') + ': ' + t('titel.dag').toLowerCase() + ' ' + e.dag + ', ' + e.van + ' → ' + e.naar + '.';
      div.appendChild(b);
      div.appendChild(document.createTextNode(' ' + t('vandaag.straks')));
      slot.appendChild(div);
    }

    /* ---------- carrousel ---------- */
    let actieveDag = 0;   // index in dagenOplopend()

    function renderCarousel() {
      const carousel = document.getElementById('dagCarousel');
      const track = document.getElementById('dagTrack');
      const pre = document.getElementById('preScroll');
      track.textContent = '';

      const dagen = dagenOplopend();
      carousel.hidden = dagen.length === 0;
      // Met één dag valt er niets te bladeren: dan alleen de stippenpil.
      document.getElementById('dagVorige').hidden = dagen.length < 2;
      document.getElementById('dagVolgende').hidden = dagen.length < 2;
      pre.hidden = dagen.length > 0;

      if (!dagen.length) {
        zetTitel();
        return;
      }

      dagen.forEach((d, i) => track.appendChild(dagSlide(d, i)));

      // Standaard op de laatste dag: dat is waar we nu zijn. Een link als
      // /volg#dag-3 opent die dag, zodat je een losse dag kunt delen.
      const uitHash = (location.hash.match(/^#dag-(\d+)$/) || [])[1];
      const viaHash = uitHash ? dagen.findIndex(d => d.dag === Number(uitHash)) : -1;
      if (viaHash !== -1) actieveDag = viaHash;
      else actieveDag = Math.min(actieveDag || dagen.length - 1, dagen.length - 1);
      toonDag(actieveDag, true);
    }

    function dagSlide(d, index) {
      const etappe = etappeVoorDag(d.dag);
      const slide = document.createElement('article');
      slide.className = 'dag-slide';
      slide.id = 'dag-' + d.dag; // deeplink: /volg#dag-3
      slide.dataset.index = String(index);

      const van = d.van || (etappe && etappe.van);
      const naar = d.naar || (etappe && etappe.naar);
      const fotos = Array.isArray(d.fotos) ? d.fotos.slice() : [];

      // Alle foto's van de dag gestapeld in de kaart; de diashow wisselt ze.
      // Geen eigen knop: de hele kaart klikt. Alleen de zichtbare foto heeft
      // een alt, de rest is voor een schermlezer herhaling.
      if (fotos.length) {
        const held = document.createElement('div');
        held.className = 'dag-hero';
        const stippen = document.createElement('div');
        stippen.className = 'hero-stippen';
        stippen.setAttribute('aria-hidden', 'true');
        fotos.forEach((src, i) => {
          const img = document.createElement('img');
          img.src = src;
          img.decoding = 'async';
          if (i === 0) img.classList.add('is-zicht');
          img.alt = i === 0 ? dagAlt(d, van, naar, 0) : '';
          const stip = document.createElement('span');
          stip.className = 'hero-stip' + (i === 0 ? ' is-zicht' : '');
          img.addEventListener('error', () => { img.remove(); stip.remove(); }, { once: true });
          held.appendChild(img);
          stippen.appendChild(stip);
        });
        if (fotos.length > 1) held.appendChild(stippen);
        slide.appendChild(held);
      }

      const body = document.createElement('div');
      body.className = 'dag-body';
      slide.appendChild(body);
      const inner = document.createElement('div');
      inner.className = 'slide-inner';
      body.appendChild(inner);

      if (d.datum) {
        const dt = document.createElement('p');
        dt.className = 'dag-datum';
        dt.textContent = fmtDatum(d.datum);
        inner.appendChild(dt);
      }

      const titel = lang === 'en' ? (d.titel_en || d.titel) : d.titel;
      if (titel) {
        const h = document.createElement('h2');
        h.className = 'dag-titel';
        h.textContent = titel;
        inner.appendChild(h);
      }

      if (van && naar) {
        const r = document.createElement('p');
        r.className = 'dag-route';
        r.appendChild(document.createTextNode(van));
        const pijl = document.createElement('span');
        pijl.className = 'pijl';
        pijl.setAttribute('aria-hidden', 'true');
        pijl.textContent = ' → ';
        r.appendChild(pijl);
        r.appendChild(document.createTextNode(naar));
        inner.appendChild(r);
      }

      const cijfers = dagCijfers(d, etappe);
      if (cijfers) inner.appendChild(cijfers);

      // De wenk dat er meer is; de hele kaart doet hetzelfde.
      const lees = document.createElement('button');
      lees.type = 'button';
      lees.className = 'dag-lees';
      lees.appendChild(document.createTextNode(t('dag.lees')));
      const leesPijl = document.createElement('span');
      leesPijl.className = 'pijl';
      leesPijl.setAttribute('aria-hidden', 'true');
      leesPijl.textContent = '→';
      lees.appendChild(leesPijl);
      inner.appendChild(lees);

      // Eén klik, één betekenis: een buurkaart komt naar voren, de actieve
      // dag opent zijn verhaal. Capture-fase, zodat niets in de kaart er
      // tussendoor fietst.
      slide.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const i = Number(slide.dataset.index);
        if (i !== actieveDag) toonDag(i);
        else openDag(d);
      }, true);

      return slide;
    }

    /* De dagteksten uit de JSON zijn platte tekst, met één uitzondering:
       **zo** wordt vet. Bewust met losse tekstknopen en niet met innerHTML,
       want die tekst mag nooit als HTML gelezen worden. Staat er een oneven
       aantal sterretjes, dan is het geen opmaak en blijft alles zoals het is. */
    function vulMetVet(el, tekst) {
      const stukken = tekst.split('**');
      if (stukken.length % 2 === 0) { el.textContent = tekst; return; }
      stukken.forEach((stuk, i) => {
        if (!stuk) return;
        if (i % 2 === 1) {
          const b = document.createElement('strong');
          b.textContent = stuk;
          el.appendChild(b);
        } else {
          el.appendChild(document.createTextNode(stuk));
        }
      });
    }

    function dagAlt(d, van, naar, i) {
      const kop = d.dag === 0 ? t('titel.dag0Kort') : t('titel.dag') + ' ' + d.dag;
      return kop
        + (van && naar ? ' — ' + van + ' naar ' + naar : '') + ' (' + (i + 1) + ')';
    }

    function dagCijfers(d, etappe) {
      const rij = document.createElement('div');
      rij.className = 'dag-cijfers';
      if (d.track) {
        rij.appendChild(cijfer(fmtKm(d.track.afstandKm) + ' km', t('dag.afstand')));
        if (d.track.tijdSeconden) rij.appendChild(cijfer(fmtTijd(d.track.tijdSeconden), t('dag.tijd')));
        if (d.track.hoogtemeters) rij.appendChild(cijfer(Math.round(d.track.hoogtemeters) + ' m', t('dag.hoogte')));
      } else if (etappe) {
        rij.appendChild(cijfer(etappe.km + ' km', t('dag.afstand')));
      }
      return rij.childElementCount ? rij : null;
    }

    /* ---------- het verhaal (leesvenster) ---------- */
    let popupVanaf = null;   // waar de focus vandaan kwam

    function openDag(d) {
      const etappe = etappeVoorDag(d.dag);
      const van = d.van || (etappe && etappe.van);
      const naar = d.naar || (etappe && etappe.naar);
      const fotos = Array.isArray(d.fotos) ? d.fotos.slice() : [];

      const paneel = document.getElementById('popupPaneel');
      paneel.textContent = '';

      // Hier is de foto wel een knop: schermvullend bekijken.
      if (fotos.length) {
        const held = document.createElement('button');
        held.type = 'button';
        held.className = 'dag-hero';
        held.setAttribute('aria-label', t('foto.open').replace('{n}', 1));
        const img = document.createElement('img');
        img.src = fotos[0];
        img.decoding = 'async';
        img.alt = dagAlt(d, van, naar, 0);
        img.addEventListener('error', () => held.remove(), { once: true });
        held.appendChild(img);
        held.addEventListener('click', () => openFoto(fotos, 0, img.alt));
        paneel.appendChild(held);
      }

      const body = document.createElement('div');
      body.className = 'dag-body';
      paneel.appendChild(body);

      if (d.datum) {
        const dt = document.createElement('p');
        dt.className = 'dag-datum';
        dt.textContent = fmtDatum(d.datum);
        body.appendChild(dt);
      }

      const titel = lang === 'en' ? (d.titel_en || d.titel) : d.titel;
      if (titel) {
        const h = document.createElement('h2');
        h.className = 'dag-titel';
        h.textContent = titel;
        body.appendChild(h);
      }

      if (van && naar) {
        const r = document.createElement('p');
        r.className = 'dag-route';
        r.appendChild(document.createTextNode(van));
        const pijl = document.createElement('span');
        pijl.className = 'pijl';
        pijl.setAttribute('aria-hidden', 'true');
        pijl.textContent = ' → ';
        r.appendChild(pijl);
        r.appendChild(document.createTextNode(naar));
        body.appendChild(r);
      }

      const cijfers = dagCijfers(d, etappe);
      if (cijfers) body.appendChild(cijfers);

      const tekst = lang === 'en' ? (d.tekst_en || d.tekst_nl) : d.tekst_nl;
      if (tekst) {
        // Lege regel scheidt alinea's, net als in data/teksten/dag-N.md.
        tekst.split(/\n\s*\n/).forEach(stuk => {
          const s = stuk.trim();
          if (!s) return;
          const p = document.createElement('p');
          p.className = 'dag-tekst';
          vulMetVet(p, s);
          body.appendChild(p);
        });
        // Mislukte de vertaling, dan tonen we het Nederlands: beter dan een
        // leeg venster. Wel even zeggen, anders lijkt het een fout.
        if (lang === 'en' && !d.tekst_en && d.tekst_nl) {
          const note = document.createElement('p');
          note.className = 'dag-nietvertaald';
          note.textContent = t('dag.nietVertaald');
          body.appendChild(note);
        }
      }

      // De rest van de foto's; de eerste hangt al bovenaan het venster.
      const rest = fotos.slice(1);
      if (rest.length) {
        const grid = document.createElement('div');
        grid.className = 'dag-fotos';
        rest.forEach((src, i) => {
          const knop = document.createElement('button');
          knop.type = 'button';
          knop.className = 'dag-foto';
          // Bij een oneven aantal krijgt de eerste de volle breedte, zodat
          // er nooit een halve lege rij overblijft.
          if (i === 0 && rest.length % 2 === 1) knop.classList.add('wide');
          knop.setAttribute('aria-label', t('foto.open').replace('{n}', i + 2));

          const img = document.createElement('img');
          img.src = src;
          img.loading = 'lazy';
          img.decoding = 'async';
          // Mist een foto (verkeerd pad, niet meegecommit), haal hem dan weg
          // in plaats van een kapot beeldvlak te tonen.
          img.addEventListener('error', () => knop.remove(), { once: true });
          img.alt = dagAlt(d, van, naar, i + 1);

          knop.appendChild(img);
          knop.addEventListener('click', () => openFoto(fotos, i + 1, img.alt));
          grid.appendChild(knop);
        });
        body.appendChild(grid);
      }

      popupVanaf = document.activeElement;
      document.getElementById('dagPopup').hidden = false;
      document.getElementById('popupPaneel').scrollTop = 0;
      document.getElementById('popupSluit').focus();
    }

    function sluitDag() {
      const popup = document.getElementById('dagPopup');
      if (popup.hidden) return;
      popup.hidden = true;
      if (popupVanaf && document.contains(popupVanaf)) popupVanaf.focus();
      popupVanaf = null;
    }

    /* De foto's in de actieve kaart wisselen vanzelf, elke vier seconden.
       Alleen de kaart die je leest: de buren staan stil, en zodra je het
       verhaal of een foto groot opent pauzeert de wissel. Bij
       prefers-reduced-motion blijft de eerste foto gewoon staan. */
    function bindDiashow() {
      if (kalm.matches) return;
      setInterval(() => {
        if (document.hidden) return;
        if (document.getElementById('dagCarousel').hidden) return;
        if (!document.getElementById('dagPopup').hidden) return;
        if (!document.getElementById('lightbox').hidden) return;
        const held = document.querySelector('.dag-slide.is-huidig .dag-hero');
        if (!held) return;
        const beelden = [...held.querySelectorAll('img')];
        if (beelden.length < 2) return;
        const i = Math.max(0, beelden.findIndex(b => b.classList.contains('is-zicht')));
        const volgende = (i + 1) % beelden.length;
        beelden[i].classList.remove('is-zicht');
        beelden[volgende].classList.add('is-zicht');
        held.querySelectorAll('.hero-stip').forEach((s, n) => {
          s.classList.toggle('is-zicht', n === volgende);
        });
      }, 4000);
    }

    function bindPopup() {
      const popup = document.getElementById('dagPopup');
      document.getElementById('popupSluit').addEventListener('click', sluitDag);
      // Klikken naast het paneel sluit; het paneel zelf niet.
      popup.addEventListener('click', e => { if (e.target === popup) sluitDag(); });
      document.addEventListener('keydown', e => {
        if (popup.hidden) return;
        // Eerst de foto dicht, dan pas het verhaal: de lightbox ligt erboven.
        if (!document.getElementById('lightbox').hidden) return;
        if (e.key === 'Escape') sluitDag();
      });
    }

    /* Springt naar dag `i`. `direct` slaat de animatie over, wat nodig is bij
       de eerste render: dan is de breedte net gezet en zou smooth scrollen
       een zichtbare veeg over alle dagen geven. */
    /* Tijdens een geanimeerde sprong komt de track langs alle tussenliggende
       dagen, en de scroll-listener zou de titel dan per dag laten flitsen
       (dag 3 → 2 → 1). Zolang deze vlag staat kijkt de listener niet mee:
       de titel staat al op het doel. Hij gaat er weer af zodra de scroll
       tot rust komt. */
    let negeerScroll = false;
    let scrollRust = 0;

    function toonDag(i, direct) {
      const track = document.getElementById('dagTrack');
      const n = track.children.length;
      if (!n) return;

      actieveDag = Math.max(0, Math.min(n - 1, i));
      // De kaarten zijn smaller dan de track (de buren kijken mee), dus de
      // doelpositie is het midden van de kaart in het midden van de track.
      const kaart = track.children[actieveDag];
      negeerScroll = !direct;
      // Vangnet voor als er geen scroll-events komen (we staan er al).
      clearTimeout(scrollRust);
      if (!direct) scrollRust = setTimeout(() => { negeerScroll = false; }, 900);
      track.scrollTo({
        left: kaart.offsetLeft - (track.clientWidth - kaart.clientWidth) / 2,
        behavior: direct ? 'auto' : 'smooth',
      });
      syncDag();
    }

    /* Titel, pijlen, balk en kaartaccent gelijkzetten met de zichtbare dag. */
    function syncDag() {
      const dagen = dagenOplopend();
      if (!dagen.length) return;

      zetTitel();

      document.getElementById('dagVorige').disabled = actieveDag <= 0;
      document.getElementById('dagVolgende').disabled = actieveDag >= dagen.length - 1;

      document.querySelectorAll('.voortgang-bar button').forEach(b => {
        const idx = Number(b.dataset.index);
        b.classList.toggle('is-actief', idx === actieveDag);
      });

      document.querySelectorAll('.dag-track > .dag-slide').forEach((s, i) => {
        s.classList.toggle('is-huidig', i === actieveDag);
      });

      markeerDagOpKaart(dagen[actieveDag]);
      volgKaart(dagen[actieveDag]);
    }

    function bindCarousel() {
      const track = document.getElementById('dagTrack');

      // Bijhouden waar je met vegen belandt. De stap tussen twee kaarten is
      // kaartbreedte + gap; die lezen we uit de eerste twee kaarten af in
      // plaats van hem hier te herhalen.
      track.addEventListener('scroll', () => {
        if (negeerScroll) {
          // Geanimeerde sprong onderweg: pas weer meekijken als hij stilstaat.
          clearTimeout(scrollRust);
          scrollRust = setTimeout(() => { negeerScroll = false; }, 150);
          return;
        }
        const kids = track.children;
        if (kids.length < 2) return;
        const stap = kids[1].offsetLeft - kids[0].offsetLeft;
        if (!stap) return;
        const i = Math.max(0, Math.min(kids.length - 1, Math.round(track.scrollLeft / stap)));
        if (i !== actieveDag) { actieveDag = i; syncDag(); }
      }, { passive: true });

      document.getElementById('dagVorige').addEventListener('click', () => toonDag(actieveDag - 1));
      document.getElementById('dagVolgende').addEventListener('click', () => toonDag(actieveDag + 1));

      // Bij het draaien van een telefoon of het verslepen van een venster
      // klopt de scrollpositie niet meer: die is in pixels, niet in dagen.
      window.addEventListener('resize', () => {
        if (!document.getElementById('dagCarousel').hidden) toonDag(actieveDag, true);
      });

      document.addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (!document.getElementById('lightbox').hidden) return; // die stuurt zichzelf
        if (!document.getElementById('dagPopup').hidden) return; // eerst lezen
        if (document.getElementById('dagCarousel').hidden) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); toonDag(actieveDag - 1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); toonDag(actieveDag + 1); }
      });
    }

    /* ---------- foto schermvullend ---------- */
    let lbFotos = [];
    let lbIndex = 0;
    let lbVanaf = null;   // waar de focus vandaan kwam

    function openFoto(fotos, i, alt) {
      lbFotos = fotos;
      lbIndex = i;
      lbVanaf = document.activeElement;
      const box = document.getElementById('lightbox');
      box.hidden = false;
      document.getElementById('lbImg').alt = alt || '';
      toonFoto(i);
      document.getElementById('lbSluit').focus();
    }
    function toonFoto(i) {
      if (!lbFotos.length) return;
      lbIndex = (i + lbFotos.length) % lbFotos.length;
      document.getElementById('lbImg').src = lbFotos[lbIndex];
      document.getElementById('lbTeller').textContent = (lbIndex + 1) + ' / ' + lbFotos.length;
      const eenFoto = lbFotos.length < 2;
      document.getElementById('lbPrev').hidden = eenFoto;
      document.getElementById('lbNext').hidden = eenFoto;
    }
    function sluitFoto() {
      document.getElementById('lightbox').hidden = true;
      document.getElementById('lbImg').removeAttribute('src');
      // Terug naar de foto waar je vandaan kwam, anders staat de focus na het
      // sluiten weer helemaal bovenaan de pagina.
      if (lbVanaf && document.contains(lbVanaf)) lbVanaf.focus();
      lbVanaf = null;
    }
    function bindLightbox() {
      const box = document.getElementById('lightbox');
      document.getElementById('lbSluit').addEventListener('click', sluitFoto);
      document.getElementById('lbPrev').addEventListener('click', () => toonFoto(lbIndex - 1));
      document.getElementById('lbNext').addEventListener('click', () => toonFoto(lbIndex + 1));
      // Klikken naast de foto sluit. De knoppen en de foto zelf niet.
      box.addEventListener('click', e => { if (e.target === box) sluitFoto(); });
      document.addEventListener('keydown', e => {
        if (box.hidden) return;
        if (e.key === 'Escape') sluitFoto();
        if (e.key === 'ArrowLeft') toonFoto(lbIndex - 1);
        if (e.key === 'ArrowRight') toonFoto(lbIndex + 1);
      });
    }

    function cijfer(waarde, label) {
      const el = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = waarde;
      const i = document.createElement('i');
      i.textContent = label;
      el.appendChild(b); el.appendChild(i);
      return el;
    }

    /* ---------- socials ---------- */
    /* De drie kanalen waar we de reis delen. Zelfde links en iconen als de
       footer op de hoofdsite, zodat het een merk blijft. YouTube wijst naar
       de film en niet naar een kanaal: dat is voorlopig wat er staat. */
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const SOCIALS = [
      { naam: 'Instagram',
        url: 'https://www.instagram.com/backtobeingtech/',
        // Een vlak met gaten erin, dus evenodd; zonder die regel lopen de
        // lens en de zoeker dicht.
        even: true,
        pad: 'M7.6 2h8.8A5.6 5.6 0 0 1 22 7.6v8.8a5.6 5.6 0 0 1-5.6 5.6H7.6A5.6 5.6 0 0 1 2 16.4V7.6A5.6 5.6 0 0 1 7.6 2Zm4.4 4.9a5.1 5.1 0 1 0 0 10.2 5.1 5.1 0 0 0 0-10.2Zm0 2.35a2.75 2.75 0 1 1 0 5.5 2.75 2.75 0 0 1 0-5.5ZM17.5 5.2a1.35 1.35 0 1 0 0 2.7 1.35 1.35 0 0 0 0-2.7Z' },
      { naam: 'TikTok',
        url: 'https://www.tiktok.com/@backtobeing.tech',
        pad: 'M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07Z' },
      { naam: 'YouTube',
        url: 'https://www.youtube.com/watch?v=v32XZxS0QCA',
        pad: 'M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.08 0 12 0 12s0 3.92.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.92 24 12 24 12s0-3.92-.5-5.81ZM9.55 15.57V8.43L15.82 12l-6.27 3.57Z' }
    ];

    function bouwSocials() {
      const blok = document.createElement('div');
      blok.className = 'teaser-socials';

      const kop = document.createElement('p');
      kop.className = 'teaser-socials-kop';
      kop.textContent = t('socials.kop');
      blok.appendChild(kop);

      const rij = document.createElement('div');
      rij.className = 'teaser-socials-rij';
      SOCIALS.forEach(kanaal => {
        const a = document.createElement('a');
        a.href = kanaal.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'currentColor');
        svg.setAttribute('aria-hidden', 'true');
        const p = document.createElementNS(SVG_NS, 'path');
        p.setAttribute('d', kanaal.pad);
        if (kanaal.even) {
          p.setAttribute('fill-rule', 'evenodd');
          p.setAttribute('clip-rule', 'evenodd');
        }
        svg.appendChild(p);

        // De naam staat er als tekst naast, dus het icoon hoeft geen label.
        a.append(svg, document.createTextNode(kanaal.naam));
        rij.appendChild(a);
      });
      blok.appendChild(rij);
      return blok;
    }

    /* ---------- teaser (voor vertrek) ---------- */
    /* De reis die eraan komt als kaart, PolarSteps-achtig: foto, vertrek en
       route. Verdwijnt zodra dag 1 er staat, dan neemt de carrousel het
       over. */
    function renderTeaser() {
      const slot = document.getElementById('teaserSlot');
      slot.textContent = '';
      if (!route || !route.punten.length || dagenOplopend().length) return;

      const start = (log && log.startDatum) || (route.etappes[0] && route.etappes[0].datum);
      if (!start) return;

      const kaart = document.createElement('div');
      kaart.className = 'teaser-kaart';

      // Beeld eerst: de tekst staat op de foto, niet eronder.
      const held = document.createElement('div');
      held.className = 'teaser-held';
      const img = document.createElement('img');
      img.src = 'founders-group.jpg';
      img.alt = 'Max, Caesar en Stijn';
      img.decoding = 'async';
      // Zonder foto blijft de tekst staan, op het donkergroen van het merk.
      img.addEventListener('error', () => {
        img.remove();
        held.classList.add('is-zonder-foto');
      }, { once: true });
      held.appendChild(img);

      const tekst = document.createElement('div');
      tekst.className = 'teaser-tekst';

      // "Vertrek uit Valença": ze vliegen al een dag eerder, dus zonder
      // plaatsnaam zou dit als de vliegdag gelezen kunnen worden.
      const dt = document.createElement('p');
      dt.className = 'teaser-eyebrow';
      const plek = document.createElement('span');
      plek.textContent = t('teaser.vertrek').replace('{plaats}', route.punten[0].naam);
      const wanneer = document.createElement('span');
      wanneer.textContent = fmtDatum(start) + ' · ' + ((log && log.startTijd) || '08:00');
      // De losse punt staat buiten de nowrap-spans: daar mag de regel breken.
      dt.append(plek, document.createTextNode(' · '), wanneer);
      tekst.appendChild(dt);

      const h = document.createElement('h2');
      h.className = 'teaser-titel';
      h.appendChild(document.createTextNode(route.punten[0].naam));
      const pijl = document.createElement('span');
      pijl.className = 'pijl';
      pijl.setAttribute('aria-hidden', 'true');
      pijl.textContent = ' → ';
      h.appendChild(pijl);
      h.appendChild(document.createTextNode(route.punten[route.punten.length - 1].naam));
      tekst.appendChild(h);

      const feiten = document.createElement('p');
      feiten.className = 'teaser-feiten';
      feiten.textContent = t('teaser.feiten')
        .replace('{km}', route.totaalKm || 123)
        .replace('{n}', totaalDagen());
      tekst.appendChild(feiten);

      held.appendChild(tekst);
      kaart.appendChild(held);

      kaart.appendChild(bouwSocials());
      slot.appendChild(kaart);
    }

    /* ---------- kaart ---------- */
    const MAPLIBRE_VERSION = '5.9.0';
    const CARTO_STYLE = 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json';

    /* Wacht bewust op ZOWEL de CSS als de JS. Als de JS eerder resolvet dan
       de CSS mist MapLibre `.maplibregl-canvas { position: absolute }` en
       belandt de canvas in de normale flow op 2x containergrootte, wat met
       overflow:hidden een zwart blok oplevert. Zie index.html. */
    let maplibrePromise = null;
    function ensureMaplibre() {
      if (maplibrePromise) return maplibrePromise;

      const cssPromise = new Promise((resolve, reject) => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://unpkg.com/maplibre-gl@' + MAPLIBRE_VERSION + '/dist/maplibre-gl.css';
        css.integrity = 'sha384-gNYNsUmuZqDYiT3gbirWTV5K7rt71RoveS/yXAaU09d4ZUmeDVTD3XoqB6uJAIFR';
        css.crossOrigin = 'anonymous';
        css.addEventListener('load', () => resolve(), { once: true });
        css.addEventListener('error', () => reject(new Error('maplibre css load failed')), { once: true });
        document.head.appendChild(css);
      });

      const jsPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/maplibre-gl@' + MAPLIBRE_VERSION + '/dist/maplibre-gl.js';
        s.integrity = 'sha384-81ppUWZZO+pveTPk4qU9cZuScEFULHfuOMHVJHFZ7xVBlWQTG1zsPrVIMGAl1WMb';
        s.crossOrigin = 'anonymous';
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('maplibre js load failed'));
        document.head.appendChild(s);
      });

      maplibrePromise = Promise.all([cssPromise, jsPromise]).then(() => {})
        .catch(err => { maplibrePromise = null; throw err; });
      return maplibrePromise;
    }

    /* MapLibre rendert een 0x0 canvas als de container nog geen afmetingen
       heeft. Wacht tot dat wel zo is. */
    function waitForLayout(el, maxFrames = 60) {
      return new Promise(resolve => {
        let frames = 0;
        (function check() {
          if ((el.offsetWidth > 0 && el.offsetHeight > 0) || frames >= maxFrames) { resolve(); return; }
          frames += 1;
          requestAnimationFrame(check);
        })();
      });
    }

    /* Ruime marge: de wash eet aan alle kanten een stuk van de kaart op, en
       bovenaan ligt ook nog de navigatiebalk. */
    function mapPadding() {
      // Onder zit het kaartje "waar we nu zijn", dus daar moet meer ruimte
      // overblijven dan boven. Op mobiel beslaat dat kaartje de volle breedte.
      // Boven moet in beide gevallen de navbalk (72 px) eruit blijven, plus
      // ruimte voor het label van Santiago dat op het bovenste punt hangt.
      return breed.matches
        ? { top: 110, bottom: 150, left: 120, right: 150 }
        : { top: 105, bottom: 170, left: 44, right: 44 };
    }

    /* Zet de juiste paint-property afhankelijk van het layertype. */
    function verf(layer, color, opacity) {
      layer.paint = layer.paint || {};
      const key = layer.type === 'background' ? 'background'
        : layer.type === 'fill' ? 'fill'
        : layer.type === 'line' ? 'line'
        : null;
      if (!key) return;
      layer.paint[key + '-color'] = color;
      if (opacity != null) layer.paint[key + '-opacity'] = opacity;
    }

    /* Haalt de CARTO-style op en herschildert hem in de huisstijl. De
       nolabels-variant heeft geen symbol-layers, dus er is geen font-
       probleem: plaatsnamen zetten we zelf als HTML-marker. */
    async function huisstijlStyle() {
      const res = await fetch(CARTO_STYLE);
      if (!res.ok) throw new Error('style fetch failed: ' + res.status);
      const style = await res.json();

      // Prefix-filter in plaats van een harde lijst, zodat een style-update
      // bij CARTO geen wegen terug laat lekken.
      // boundary_country_outline is een halo van 8 px breed rond elke
      // landsgrens. Ook doorzichtig gemaakt blijft dat een sluier die dwars
      // door de kaart loopt en zwaarder weegt dan onze eigen route, dus die
      // gaat er helemaal uit.
      const WEG = /^(road_|tunnel_|bridge_|rail|aeroway-|building|boundary_(state|county|country_outline))/;
      style.layers = style.layers.filter(l => !WEG.test(l.id));

      for (const l of style.layers) {
        if (l.id === 'background' || l.id.startsWith('landcover') || l.id.startsWith('landuse')) {
          verf(l, '#fffef1', 1);
        } else if (l.id.startsWith('park_')) {
          verf(l, '#97a081', 0.1);
        } else if (l.id.startsWith('waterway')) {
          // Riviertjes zijn lijnen, net als onze route. Extra laag houden,
          // anders vecht het beekjesnetwerk met de Camino om de aandacht.
          verf(l, '#a7bdd5', 0.3);
        } else if (l.id.startsWith('water')) {
          verf(l, '#a7bdd5', 0.5);
        } else if (l.id.startsWith('boundary_')) {
          // Alleen de landsgrens blijft over. Die is het tonen waard, want dag
          // 1 loopt van Portugal naar Spanje. Wel als haarlijn: CARTO zet hier
          // een breedte per zoomniveau, en die overschrijven we met een vaste 1
          // zodat de grens nooit met de route om de aandacht vecht.
          verf(l, '#2a3723', 0.3);
          l.paint['line-width'] = 1;
        }
      }
      return style;
    }

    function lijnBron(coords) {
      return {
        type: 'geojson',
        data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } },
      };
    }

    async function initMap() {
      const pane = document.getElementById('mapPane');
      const el = document.getElementById('volgMap');
      const loading = document.getElementById('mapLoading');

      try {
        await ensureMaplibre();
        await waitForLayout(el);
        const style = await huisstijlStyle();

        const geplandeCoords = route.punten.map(p => p.lngLat);
        const gelopen = gelopenCoords();

        map = new maplibregl.Map({
          container: el,
          style: style,
          center: [-8.61, 42.46],
          zoom: 8,
          attributionControl: false,
          dragRotate: false,
          pitchWithRotate: false,
          touchZoomRotate: false,
        });

        // Op mobiel plakt de kaart achter een scrollende feed: daar mag hij de
        // scroll niet kapen, dus alles staat uit tot je hem aanklikt. Op
        // desktop is de kaart een eigen kolom die zelf niet scrollt, dus daar
        // is een gebaar op de kaart nooit een gebaar voor de pagina.
        zetInteractie(false);

        let gebouwd = false;
        // Watchdog: op trage wifi (of als unpkg/CARTO onbereikbaar is) mag de
        // bezoeker niet eindeloos naar "Kaart laden" blijven kijken.
        const watchdog = setTimeout(() => {
          if (gebouwd) return;
          loading.className = 'map-error';
          loading.textContent = t('map.error');
        }, 15000);

        map.on('load', () => {
          gebouwd = true;
          clearTimeout(watchdog);
          loading.remove();

          if (breed.matches) {
            zetInteractie(true);
            pane.classList.add('is-active');
          }

          // De volle route ligt eronder als lichte stippellijn: dat is het
          // plan. De GPS-track ligt er donkergroen overheen: dat is wat we
          // echt gelopen hebben.
          map.addSource('route-gepland', lijnBron(geplandeCoords));
          map.addLayer({
            id: 'route-gepland-line',
            type: 'line',
            source: 'route-gepland',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#2a3723',
              'line-width': 3,
              'line-opacity': 0.38,
              'line-dasharray': [1.4, 1.6],
            },
          });

          if (gelopen.length) {
            map.addSource('route-gelopen', lijnBron(gelopen));
            // Cremen casing eronder, zodat de groene lijn ook over water en
            // parken heen leesbaar blijft.
            map.addLayer({
              id: 'route-gelopen-casing',
              type: 'line',
              source: 'route-gelopen',
              layout: { 'line-cap': 'round', 'line-join': 'round' },
              paint: { 'line-color': '#fffef1', 'line-width': 9, 'line-opacity': 0.9 },
            });
            map.addLayer({
              id: 'route-gelopen-line',
              type: 'line',
              source: 'route-gelopen',
              layout: { 'line-cap': 'round', 'line-join': 'round' },
              paint: { 'line-color': '#2a3723', 'line-width': 4 },
            });
          }

          // Accent op de dag die je op dat moment leest. Leeg tot syncDag hem
          // vult, zodat de laag alvast in de goede volgorde staat.
          map.addSource('route-actief', lijnBron([]));
          map.addLayer({
            id: 'route-actief-gloed',
            type: 'line',
            source: 'route-actief',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#97a081', 'line-width': 18, 'line-opacity': 0.7, 'line-blur': 5 },
          });
          map.addLayer({
            id: 'route-actief-line',
            type: 'line',
            source: 'route-actief',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#2a3723', 'line-width': 5 },
          });

          plaatsMarkers();
          dagMarkers();
          plaatsPositie(gelopen);

          map.resize();
          fitOp(geplandeCoords);
          syncDag();

          let frame = 0;
          const ro = new ResizeObserver(() => {
            if (frame) cancelAnimationFrame(frame);
            frame = requestAnimationFrame(() => { frame = 0; if (map) map.resize(); });
          });
          ro.observe(el);
        });

        map.on('error', e => {
          // Losse tile-fouten mogen de pagina niet slopen.
          console.warn('[volg] maplibre:', e && e.error ? e.error.message : e);
        });

      } catch (err) {
        console.error('[volg] kaart kon niet laden:', err);
        loading.className = 'map-error';
        loading.textContent = t('map.error');
      }
    }

    function zetInteractie(aan) {
      if (!map) return;
      ['scrollZoom', 'dragPan', 'doubleClickZoom', 'keyboard'].forEach(n => {
        if (map[n]) aan ? map[n].enable() : map[n].disable();
      });
    }

    /* Alleen de plaatsen die een etappe beginnen of eindigen krijgen een
       label; alle 19 punten labelen wordt een wirwar op mobiel. */
    function plaatsMarkers() {
      const belangrijk = new Set();
      route.etappes.forEach(e => { belangrijk.add(e.vanIndex); belangrijk.add(e.totIndex - 1); });

      route.punten.forEach((punt, i) => {
        if (!belangrijk.has(i)) return;
        const laatste = i === route.punten.length - 1;

        const stip = document.createElement('div');
        stip.className = 'map-punt';
        new maplibregl.Marker({ element: stip, anchor: 'center' }).setLngLat(punt.lngLat).addTo(map);

        const div = document.createElement('div');
        // Zeven namen passen niet in de lage kaart op een telefoon: ze
        // stapelen op elkaar. De tussenliggende krijgen daarom een klasse die
        // CSS onder 1024px verbergt. Dat gaat via CSS en niet via een check
        // hier, zodat het meteen klopt als je een venster smaller sleept.
        div.className = 'map-place'
          + (i === 0 || laatste ? ' is-endpoint' : ' is-tussen');
        div.textContent = punt.naam;
        // Santiago ligt rechtsboven in de bocht van de route, dus daar hangt
        // een label rechts van de stip half buiten beeld. Alleen dat label
        // klapt naar links; de rest staat rechts, wat rustiger leest.
        // 18px opzij: de dagbolletjes (24px) en de positiemarker (20px) staan
        // gecentreerd op hetzelfde punt, dus met minder ruimte valt het label
        // achter de marker weg.
        new maplibregl.Marker(laatste
          ? { element: div, anchor: 'right', offset: [-18, 0] }
          : { element: div, anchor: 'left', offset: [18, 0] })
          .setLngLat(punt.lngLat)
          .addTo(map);
      });
    }

    /* Genummerd bolletje op het eindpunt van elke afgeronde dag. De laatste
       dag krijgt er geen: daar staat de pulserende positiemarker. */
    function dagMarkers() {
      const dagen = dagenOplopend();
      dagen.forEach((d, i) => {
        if (i === dagen.length - 1) return;
        const coords = (d.track && d.track.coords && d.track.coords.length)
          ? d.track.coords
          : etappeCoords(etappeVoorDag(d.dag));
        if (!coords.length) return;

        const el = document.createElement('div');
        el.className = 'map-dag';
        el.textContent = d.dag;
        el.title = t('titel.dag') + ' ' + d.dag;
        el.addEventListener('click', () => toonDag(i));
        new maplibregl.Marker({ element: el, anchor: 'center' })
          .setLngLat(coords[coords.length - 1])
          .addTo(map);
      });
    }

    function plaatsPositie(gelopen) {
      if (!gelopen.length) return;
      const el = document.createElement('div');
      el.className = 'map-positie';
      el.setAttribute('aria-label', 'Laatst bekende punt');
      new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat(gelopen[gelopen.length - 1])
        .addTo(map);
    }

    function boundsVan(coords) {
      return coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
    }
    const kalm = window.matchMedia('(prefers-reduced-motion: reduce)');
    function fitOp(coords, duur) {
      if (!map || !coords.length) return;
      map.fitBounds(boundsVan(coords), { padding: mapPadding(), duration: kalm.matches ? 0 : (duur || 0) });
    }

    function dagCoords(dag) {
      return (dag && dag.track && dag.track.coords && dag.track.coords.length)
        ? dag.track.coords
        : etappeCoords(etappeVoorDag(dag && dag.dag));
    }

    /* Tekent de dag die je leest extra dik op de kaart. Het inzoomen zelf
       zit in volgKaart, met een adempauze erin. */
    function markeerDagOpKaart(dag) {
      if (!map || !map.getSource('route-actief')) return;
      const coords = dagCoords(dag);
      map.getSource('route-actief').setData({
        type: 'Feature', properties: {},
        geometry: { type: 'LineString', coordinates: coords },
      });
    }

    function zoomNaarDag(dag, duur) {
      const coords = dagCoords(dag);
      if (!map || !coords.length) return;
      map.fitBounds(boundsVan(coords), {
        padding: mapPadding(),
        duration: kalm.matches ? 0 : (duur == null ? 900 : duur),
      });
    }

    /* De kaart volgt de dag die je leest en zoomt er zachtjes naartoe. De
       pauze vooraf zorgt dat snel doorbladeren geen stuiterende kaart geeft:
       pas als je ergens blijft hangen komt de kaart achter je aan. De
       allereerste keer wacht hij langer, zodat je eerst de hele route ziet
       en de kaart daarna naar vandaag glijdt. */
    let volgTimer = 0;
    let eersteFocus = true;
    function volgKaart(dag) {
      if (!map || !map.getSource('route-actief')) return;
      clearTimeout(volgTimer);
      const pauze = eersteFocus ? 1600 : 550;
      eersteFocus = false;
      volgTimer = setTimeout(() => zoomNaarDag(dag, 1300), pauze);
    }

    /* ---------- nav ---------- */
    function bindNav() {
      const nav = document.getElementById('siteNav');
      const btn = document.getElementById('navMenuBtn');
      btn.addEventListener('click', () => {
        const open = nav.classList.toggle('menu-open');
        btn.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', e => {
        if (!nav.contains(e.target)) {
          nav.classList.remove('menu-open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          nav.classList.remove('menu-open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    /* ---------- init ---------- */
    function renderAlles() {
      // Bij een taalwissel worden de kaarten opnieuw opgebouwd; een open
      // leesvenster zou dan naar een oude dag wijzen.
      sluitDag();
      applyStaticText();
      renderKop();
      renderVandaag();
      renderTeaser();
      renderCarousel();
    }

    function bindLangButtons() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          lang = btn.dataset.lang === 'en' ? 'en' : 'nl';
          localStorage.setItem('b2b-lang', lang);
          renderAlles();
        });
      });
    }

    function bindMapGate() {
      const pane = document.getElementById('mapPane');
      document.getElementById('mapGate').addEventListener('click', () => {
        pane.classList.add('is-active');
        zetInteractie(true);
      });
    }

    function bindMapReset() {
      document.getElementById('mapReset').addEventListener('click', () => {
        // Een nog wachtende dag-zoom zou dit meteen weer ongedaan maken.
        clearTimeout(volgTimer);
        if (route && route.punten.length) fitOp(route.punten.map(p => p.lngLat), 1100);
      });
    }

    async function start() {
      applyStaticText();
      bindNav();
      bindLangButtons();
      bindMapGate();
      bindMapReset();
      bindCarousel();
      bindPopup();
      bindLightbox();
      bindDiashow();

      try {
        // camino-log.json verandert elke dag, maar vercel.json cachet .json
        // een etmaal (die regel staat er voor de Lottie-animatie van 42 KB).
        // Die generieke regel matcht ook /data/, en het is niet gedocumenteerd
        // welke regel wint als er twee matchen. Daarom niet op de header
        // vertrouwen maar de URL uniek maken: een andere URL wordt door geen
        // enkele cache hergebruikt, ook niet door de CDN. Granulariteit van
        // een minuut, zodat snel achter elkaar herladen nog wel meeprofiteert.
        const bust = '?t=' + Math.floor(Date.now() / 60000);
        const opties = { cache: 'no-store' };
        const [r, l] = await Promise.all([
          fetch('data/camino-route.json' + bust, opties).then(res => res.json()),
          fetch('data/camino-log.json' + bust, opties).then(res => res.json()).catch(() => ({ dagen: [] })),
        ]);
        route = r;
        log = l;
      } catch (err) {
        // Bij file:// blokkeert de browser fetch. Draai een lokale server.
        console.error('[volg] data laden mislukt:', err);
        route = { punten: [], etappes: [], totaalKm: 123 };
        log = { dagen: [] };
      }

      renderAlles();
      if (route.punten.length) initMap();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
